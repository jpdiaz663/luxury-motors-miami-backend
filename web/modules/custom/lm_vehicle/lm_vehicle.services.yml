services:
  lm_vehicle.presenter:
    class: Drupal\lm_vehicle\VehiclePresenter
    arguments:
      - '@file_url_generator'
      - '@lm_vehicle.fleet_catalog'
  lm_vehicle.fleet_catalog:
    class: Drupal\lm_vehicle\FleetCatalog
    arguments:
      - '@entity_type.manager'
      - '@request_stack'
  lm_vehicle.popular_collection:
    class: Drupal\lm_vehicle\PopularCollection
    arguments:
      - '@database'
  lm_vehicle.fleet_category_representatives:
    class: Drupal\lm_vehicle\FleetCategoryRepresentatives
    arguments:
      - '@entity_type.manager'
      - '@lm_vehicle.fleet_catalog'
      - '@?lm_booking.availability'
