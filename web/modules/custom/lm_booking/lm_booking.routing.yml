lm_booking.checkout_start:
  path: '/checkout/start'
  defaults:
    _controller: '\Drupal\lm_booking\Controller\CheckoutStartController::start'
  methods: [POST]
  requirements:
    _access: 'TRUE'
    _csrf_request_header_token: 'TRUE'
  options:
    no_cache: TRUE

lm_booking.checkout:
  path: '/checkout'
  defaults:
    _controller: '\Drupal\lm_booking\Controller\CheckoutController::form'
    _title_callback: '\Drupal\lm_booking\Controller\CheckoutController::title'
  requirements:
    _access: 'TRUE'
  options:
    no_cache: TRUE

lm_booking.checkout_legacy:
  path: '/reserve/{vehicle}'
  defaults:
    _controller: '\Drupal\lm_booking\Controller\CheckoutController::legacy'
  methods: [GET]
  requirements:
    _access: 'TRUE'
    vehicle: \d+
  options:
    no_cache: TRUE

lm_booking.confirmation:
  path: '/reserve/confirmed/{booking}'
  defaults:
    _controller: '\Drupal\lm_booking\Controller\ConfirmationController::view'
    _title: 'Reservation confirmed'
  requirements:
    _custom_access: '\Drupal\lm_booking\Controller\ConfirmationController::access'
    booking: \d+
  options:
    parameters:
      booking:
        type: entity:node

lm_booking.reservation:
  path: '/reservation'
  defaults:
    _form: '\Drupal\lm_booking\Form\ReservationManageForm'
    _title: 'Find your reservation'
  requirements:
    _access: 'TRUE'
  options:
    no_cache: TRUE
